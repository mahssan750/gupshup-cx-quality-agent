[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gupshup-cx-quality-agent"
version = "0.1.0"
description = "Auditable weekly customer-service quality and inferred-satisfaction analysis for Gupshup transcript exports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Mohamed"}]
dependencies = [
  "Flask>=3.1,<4",
  "openpyxl>=3.1,<4",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[project.scripts]
cxquality = "cxquality.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

